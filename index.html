<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nafisa's Destination B1 Quizzes</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');

        :root {
            --pink-light: #fce4ec;
            --pink-medium: #f8bbd0;
            --pink-dark: #ff8a9b;
            --purple-light: #f3e5f5;
            --purple-dark: #b19cd9;
            --text-color: #5c4b6b;
            --card-bg: rgba(255, 255, 255, 0.85);
            --shadow: 0 10px 30px rgba(255, 182, 193, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #ffe6f2 0%, #f3e5f5 100%);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Cute floating hearts background */
        .hearts-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1; overflow: hidden;
        }
        .heart {
            position: absolute;
            color: var(--pink-medium);
            font-size: 24px;
            animation: floatUp 10s linear infinite;
            opacity: 0.6;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            z-index: 10;
            width: 100%;
            max-width: 800px;
            animation: fadeInDown 1s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: clamp(2em, 5vw, 3.5em);
            background: linear-gradient(90deg, #ff8a9b, #b19cd9, #ff8a9b);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            font-weight: 700;
            animation: gradientMove 3s linear infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .quote-box {
            background: rgba(255, 255, 255, 0.8);
            padding: 15px 25px;
            border-radius: 20px;
            font-style: italic;
            color: #8c7b9c;
            border-left: 5px solid var(--pink-dark);
            font-size: clamp(0.9em, 2.5vw, 1.1em);
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(255, 182, 193, 0.2);
            backdrop-filter: blur(5px);
        }

        .units-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
            padding: 10px;
            z-index: 10;
        }

        .unit-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 25px 15px;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 700;
            font-size: 1.1em;
            box-shadow: var(--shadow);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(5px);
        }

        .unit-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.4), rgba(255,255,255,0));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .unit-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 35px rgba(255, 138, 155, 0.5);
            border-color: var(--pink-medium);
        }

        .unit-card:hover::before {
            opacity: 1;
        }

        .unit-card span.emoji {
            font-size: 2em;
            margin-bottom: 10px;
            transition: transform 0.3s;
        }

        .unit-card:hover span.emoji {
            transform: scale(1.2) rotate(10deg);
        }

        .unit-card span.label {
            font-size: 0.9em;
            color: #8c7b9c;
        }

        @media (max-width: 480px) {
            .units-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            .unit-card {
                padding: 20px 10px;
                font-size: 1em;
            }
            .unit-card span.emoji { font-size: 1.5em; }
        }
    </style>
</head>
<body>
    <div class="hearts-container" id="hearts"></div>

    <div class="header">
        <h1>Nafisa's B1 Quizzes</h1>
        <div class="quote-box">
            "Nafisa, knowledge is the light that never dims. Let's shine bright today! ✨"
        </div>
        <p style="color: #8c7b9c; font-size: 1.1em; font-weight: 600;">Select a unit to begin your journey 🌸</p>
    </div>

    <div class="units-grid" id="unitsGrid">
        <!-- Units will be generated here by JavaScript -->
    </div>

    <script>
        // Generate 21 Unit Blocks (Unit 1&2 up to Unit 41&42)
        const grid = document.getElementById('unitsGrid');
        const totalUnits = 21;

        for (let i = 1; i <= totalUnits; i++) {
            const startUnit = (i * 2) - 1;
            const endUnit = i * 2;
            const fileName = `unit${startUnit}and${endUnit}.html`;
            
            const card = document.createElement('a');
            card.href = fileName;
            card.className = 'unit-card';
            
            const emojis = ['🌸', '🌺', '🌷', '🌹', '💖', '✨', '🎀', '🦄', '🌈', '☁️', '🧸', '🍭'];
            const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
            
            card.innerHTML = `
                <span class="emoji">${randomEmoji}</span>
                <span>Unit ${startUnit} & ${endUnit}</span>
                <span class="label">Grammar Quiz</span>
            `;
            
            grid.appendChild(card);
        }

        // Generate floating hearts
        const heartsContainer = document.getElementById('hearts');
        const heartEmojis = ['💖', '🌸', '✨', '💕', '🎀'];
        
        setInterval(() => {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            heartsContainer.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 10000);
        }, 500);
    </script>
</body>
</html>
